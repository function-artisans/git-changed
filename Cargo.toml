[package]
name = "git-changed"
version = "0.0.2"
authors = ["István Karaszi <ikaraszi@gmail.com>"]
description = "List the files that changed in the current git branch"
license = "MIT"
repository = "https://github.com/function-artisans/git-changed"
readme = "README.md"
keywords = ["git", "cli", "changed", "files"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["devenv.*", "flake.*", "package.nix", ".envrc", ".github/"]
edition = "2021"

[dependencies]
anyhow = "1.0.70"
clap = "4.0.18"
git2 = "0.21"
glob = "0.3.0"

[dev-dependencies]
cucumber = "0.23"
futures = "0.3"
tempfile = "3.5.0"
shlex = "2.0.1"

[[test]]
name = "features"
harness = false
